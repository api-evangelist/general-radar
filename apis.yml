name: General Radar
description: 'General Radar Corp. (GenRad) is a Belmont, California hardtech company founded in 2016 that
  designs and manufactures fully solid-state, high-resolution active electronically scanned array (AESA)
  phased-array radar systems built largely on commercial off-the-shelf hardware. Its products include the
  C-band GenRad GFC multi-mission AESA radar with a GaN front-end and digital beam-forming, and the Mark-IV
  76-81GHz millimeter-wave 3D imaging radar producing LIDAR-like point clouds. The company serves aerospace
  and defense (U.S. Air Force, Navy, NORAD), counter-drone, airfield foreign-object-debris (FOD) detection,
  autonomy, wind energy, and weather markets, and has raised over $35M from investors including Kleiner Perkins
  and Octave Ventures. General Radar publishes no public API, developer portal, SDK, or machine-readable
  interface; this profile is maintained for API Evangelist network completeness.'
